name: Run Terraform
description: Initialize, plan, and optionally apply a Terraform root.
author: ivan.pashkulev@gmail.com

inputs:
  working_directory:
    description: Terraform root directory relative to the repository.
    required: true
  action:
    description: Operation to plan, either Provision or Destroy.
    default: Provision
  should_apply:
    description: Whether to apply the generated plan, either true or false.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        WORKING_DIRECTORY: ${{ inputs.working_directory }}
        TERRAFORM_ACTION: ${{ inputs.action }}
        SHOULD_APPLY: ${{ inputs.should_apply }}
      run: |
        set -u

        if [[ -z "$WORKING_DIRECTORY" || "$WORKING_DIRECTORY" = /* ]]; then
          echo "::error::working_directory must be a non-empty relative path."
          exit 1
        fi

        if [[ ! -d "$WORKING_DIRECTORY" ]]; then
          echo "::error::working_directory does not exist."
          exit 1
        fi

        case "$TERRAFORM_ACTION" in
          Provision|Destroy) ;;
          *)
            echo "::error::action must be Provision or Destroy."
            exit 1
            ;;
        esac

        case "$SHOULD_APPLY" in
          true|false) ;;
          *)
            echo "::error::should_apply must be true or false."
            exit 1
            ;;
        esac

    - name: Terraform Init
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_IN_AUTOMATION: 'true'
      run: terraform init -input=false -lockfile=readonly

    - name: Terraform Plan
      id: plan
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_IN_AUTOMATION: 'true'
        TERRAFORM_ACTION: ${{ inputs.action }}
      run: |
        set -u

        plan_file=$(mktemp "$RUNNER_TEMP/terraform-plan.XXXXXX")
        printf 'plan_file=%s\n' "$plan_file" >> "$GITHUB_OUTPUT"

        plan_args=(-input=false -lock-timeout=5m "-out=$plan_file")
        if [[ "$TERRAFORM_ACTION" == Destroy ]]; then
          plan_args+=(-destroy)
        fi

        terraform plan "${plan_args[@]}"

    - name: Terraform Apply
      if: ${{ inputs.should_apply == 'true' }}
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        TF_IN_AUTOMATION: 'true'
        PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
      run: terraform apply -input=false -lock-timeout=5m "$PLAN_FILE"

    - name: Skip Terraform Apply Notice
      if: ${{ inputs.should_apply == 'false' }}
      shell: bash
      run: echo "Skipping terraform apply as requested."

    - name: Remove saved plan
      if: ${{ always() && steps.plan.outputs.plan_file != '' }}
      shell: bash
      env:
        PLAN_FILE: ${{ steps.plan.outputs.plan_file }}
      run: rm -f -- "$PLAN_FILE"
